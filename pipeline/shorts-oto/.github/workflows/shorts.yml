name: shorts-uret

on:
  schedule:
    - cron: "0 6 * * *"   # her gün 09:00 (Türkiye)
  workflow_dispatch:
    inputs:
      index:
        description: "Senaryo numarası (boş = sıradaki)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekenleri kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-dejavu-core jq
          pip install -q edge-tts pillow numpy

      - name: Video üret
        run: |
          if [ -n "${{ github.event.inputs.index }}" ]; then
            python make_video.py --index "${{ github.event.inputs.index }}" --out cikti
          else
            python make_video.py --out cikti
          fi

      - name: Discord'a gönder
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        if: env.WEBHOOK != ''
        run: |
          MP4=$(ls cikti/*.mp4 | head -1)
          TXT="${MP4%.mp4}.txt"
          KAPAK="${MP4%.mp4}_kapak.jpg"
          jq -Rs '{content: .[0:1900]}' "$TXT" > payload.json
          curl -sS -f -X POST "$WEBHOOK" \
            -F "payload_json=<payload.json" \
            -F "files[0]=@$MP4" \
            -F "files[1]=@$KAPAK"

      - uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: cikti/
          retention-days: 30

      - name: Sayacı kaydet
        if: github.event.inputs.index == ''
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add sayac.txt
          git commit -m "sayaç: $(cat sayac.txt)" || exit 0
          git push
