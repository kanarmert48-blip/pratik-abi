name: kanal-takip
on:
  workflow_dispatch:
    inputs:
      kanal:
        description: "Kanal @adı veya kanal ID"
        required: false
  schedule:
    - cron: "17 5 * * *"
permissions:
  contents: write
jobs:
  takip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: İstatistik topla
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          KANAL: ${{ inputs.kanal || vars.KANAL || '@PratikAbii' }}
        run: |
          mkdir -p out
          [ -n "$YT_API_KEY" ] || echo "YT_API_KEY secret YOK" > out/hata.txt
          python3 tools/kanal_takip.py "$KANAL" 2> >(tee -a out/hata.txt >&2) || true
          ls out
      - name: Release'e yükle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          R=kanal
          gh release view $R >/dev/null 2>&1 || gh release create $R --title "$R" --notes "günlük kanal istatistikleri"
          gh release upload $R out/* --clobber
