name: link-indir
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video linki (YouTube, TikTok, Instagram...)"
        required: true
      id:
        description: "Kısa ad"
        required: true
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: yt-dlp kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]"
      - name: İndir
        env:
          URL: ${{ inputs.url }}
          ID: ${{ inputs.id }}
        run: |
          mkdir -p out
          yt-dlp --no-playlist -f "bv*[height<=720]+ba/b[height<=720]/b" --merge-output-format mp4 \
            --write-info-json --write-subs --write-auto-subs --sub-langs "tr,en.*" --sub-format vtt --convert-subs vtt \
            -o "out/${ID}.%(ext)s" "$URL" || true
          ls -la out
          test -n "$(ls out/*.mp4 2>/dev/null)" || { echo "VIDEO INMEDI"; exit 1; }
      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          R=linkler
          gh release view $R >/dev/null 2>&1 || gh release create $R --title "$R" --notes "otomatik"
          gh release upload $R out/* --clobber
