name: link-indir
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video linki (YouTube, TikTok, Instagram...)"
        required: true
      id:
        description: "Kısa ad"
        required: true
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: yt-dlp kur
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -U "yt-dlp[default]"
      - name: İndir
        env:
          URL: ${{ inputs.url }}
          ID: ${{ inputs.id }}
        run: |
          mkdir -p out
          O='--no-playlist -f bv*[height<=720]+ba/b[height<=720]/b --merge-output-format mp4 --write-info-json --write-subs --write-auto-subs --sub-langs tr,en.* --convert-subs vtt'
          for C in "" "youtube:player_client=tv_simple" "youtube:player_client=web_safari" "youtube:player_client=mweb" "youtube:player_client=ios"; do
            if [ -z "$C" ]; then yt-dlp $O -o "out/${ID}.%(ext)s" "$URL" >> out/${ID}_log.txt 2>&1 || true
            else yt-dlp $O --extractor-args "$C" -o "out/${ID}.%(ext)s" "$URL" >> out/${ID}_log.txt 2>&1 || true; fi
            ls out/*.mp4 >/dev/null 2>&1 && break
          done
          ls -la out; tail -20 out/${ID}_log.txt
      - name: Release'e yükle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          R=linkler
          gh release view $R >/dev/null 2>&1 || gh release create $R --title "$R" --notes "otomatik"
          gh release upload $R out/* --clobber
